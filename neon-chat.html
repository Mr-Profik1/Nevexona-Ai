<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nevexona AI · Neon Chat</title>
<style>
:root {
  --bg: #07060a;
  --panel: rgba(20, 14, 10, 0.78);
  --card: #140e0a;
  --line: rgba(255, 122, 24, 0.22);
  --text: #f6ece4;
  --muted: #a88f7c;
  --neon: #ff7a18;
  --neon-2: #ffb347;
  --neon-glow: 0 0 6px rgba(255,122,24,.9), 0 0 18px rgba(255,122,24,.55), 0 0 36px rgba(255,122,24,.3);
  --box-glow: 0 0 0 1px rgba(255,122,24,.45), 0 0 14px rgba(255,122,24,.35), inset 0 0 12px rgba(255,122,24,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(255,122,24,.16), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(255,80,0,.12), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  overflow: hidden;
  display: flex;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font: inherit; color: var(--text); }

/* ---------- Sidebar ---------- */
.sidebar {
  width: 270px; flex-shrink: 0; background: var(--panel);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 14px; gap: 12px; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 4px 8px; }
.logo {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  font-weight: 900; font-size: 20px; color: var(--neon); background: #0b0806;
  box-shadow: var(--box-glow); text-shadow: var(--neon-glow);
}
.brand h1 { font-size: 15px; letter-spacing: .5px; text-shadow: 0 0 10px rgba(255,122,24,.5); }
.brand small { color: var(--neon-2); font-size: 10px; letter-spacing: 1.5px; }
.btn-new {
  width: 100%; padding: 10px; border-radius: 12px; font-weight: 600; color: #1a0e05;
  background: linear-gradient(135deg, var(--neon), var(--neon-2));
  box-shadow: 0 0 18px rgba(255,122,24,.45); transition: transform .12s, box-shadow .2s;
}
.btn-new:hover { box-shadow: 0 0 28px rgba(255,122,24,.75); transform: translateY(-1px); }
.chats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.chat-item {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 9px 10px; border-radius: 10px; color: var(--muted); border: 1px solid transparent;
  text-align: left; transition: .15s;
}
.chat-item span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.chat-item:hover { background: rgba(255,122,24,.07); color: var(--text); }
.chat-item.active { color: var(--neon-2); border-color: var(--line); background: rgba(255,122,24,.1); box-shadow: inset 0 0 12px rgba(255,122,24,.08); }
.chat-item .del { opacity: 0; color: #ff5a5a; padding: 0 4px; font-size: 16px; }
.chat-item:hover .del { opacity: 1; }
.side-foot { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.ghost {
  width: 100%; padding: 9px; border-radius: 10px; border: 1px solid var(--line);
  color: var(--text); transition: .15s; font-size: 13px;
}
.ghost:hover { border-color: var(--neon); box-shadow: var(--box-glow); }

/* ---------- Main ---------- */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
.topbar {
  height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--panel);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.menu-btn { display: none; font-size: 22px; color: var(--neon); text-shadow: var(--neon-glow); padding: 4px 8px; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: #666; flex-shrink: 0; }
.status-dot.on { background: var(--neon); box-shadow: var(--neon-glow); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.topbar .title { font-weight: 600; font-size: 13px; }
.spacer { flex: 1; }
select.model {
  background: #0d0906; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
  max-width: 200px; outline: none; font-size: 12px;
}
select.model:focus { border-color: var(--neon); box-shadow: var(--box-glow); }

.messages { flex: 1; overflow-y: auto; padding: 20px 16px; scroll-behavior: smooth; }
.messages::-webkit-scrollbar, .chats::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-thumb, .chats::-webkit-scrollbar-thumb { background: rgba(255,122,24,.35); border-radius: 9px; }
.wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.empty { text-align: center; margin-top: 12vh; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty .big {
  font-size: 54px; font-weight: 900; color: var(--neon); text-shadow: var(--neon-glow);
  animation: flicker 5s infinite;
}
@keyframes flicker { 0%,92%,100% { opacity: 1; } 93% { opacity: .6; } 95% { opacity: 1; } 97% { opacity: .75; } }
.empty p { color: var(--muted); max-width: 420px; line-height: 1.55; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--neon-2); font-size: 12px; transition: .15s; }
.chip:hover { border-color: var(--neon); box-shadow: var(--box-glow); }

.msg { display: flex; gap: 10px; }
.msg.user { justify-content: flex-end; }
.avatar {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center;
  font-weight: 800; color: var(--neon); background: #0b0806; box-shadow: var(--box-glow); font-size: 14px;
}
.bubble { padding: 11px 14px; border-radius: 16px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-width: 88%; }
.msg.ai .bubble { background: var(--card); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg.user .bubble {
  background: linear-gradient(135deg, var(--neon), #ff5a00); color: #1a0e05; font-weight: 500;
  border-top-right-radius: 4px; box-shadow: 0 0 18px rgba(255,122,24,.35);
}
.bubble code { background: rgba(255,122,24,.12); padding: 1px 6px; border-radius: 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
.bubble pre {
  background: #0a0705; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0;
  overflow-x: auto; white-space: pre; font-size: 12.5px;
}
.bubble pre code { background: none; padding: 0; }
.cursor::after { content: '▍'; color: var(--neon); text-shadow: var(--neon-glow); animation: pulse 1s infinite; }
.err { color: #ff8a8a; }

/* ---------- Composer ---------- */
.composer { flex-shrink: 0; padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.composer form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea#input {
  flex: 1; resize: none; max-height: 160px; min-height: 44px; padding: 12px 14px;
  background: #0d0906; border: 1px solid var(--line); border-radius: 14px; outline: none; line-height: 1.4;
}
textarea#input:focus { border-color: var(--neon); box-shadow: var(--box-glow); }
.send {
  width: 46px; height: 44px; border-radius: 14px; flex-shrink: 0; font-size: 18px; color: #1a0e05; font-weight: 800;
  background: linear-gradient(135deg, var(--neon), var(--neon-2)); box-shadow: 0 0 18px rgba(255,122,24,.5); transition: .15s;
}
.send:hover { box-shadow: 0 0 28px rgba(255,122,24,.85); }
.send.stop { background: #ff3b3b; box-shadow: 0 0 18px rgba(255,59,59,.5); color: #fff; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; font-size: 17px;
  border: 1px solid var(--line); background: #0d0906; transition: .15s;
}
.icon-btn:hover { border-color: var(--neon); box-shadow: var(--box-glow); }
.icon-btn.on { border-color: var(--neon); box-shadow: var(--box-glow); }
.mic { width: 46px; height: 44px; border-radius: 14px; flex-shrink: 0; font-size: 18px; border: 1px solid var(--line); background: #0d0906; transition: .15s; }
.mic:hover { border-color: var(--neon); box-shadow: var(--box-glow); }
.mic.on { background: #ff3b3b; border-color: #ff3b3b; box-shadow: 0 0 20px rgba(255,59,59,.7); animation: pulse 1s infinite; }
.bubble a { color: var(--neon-2); }
.limit { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,122,24,.05); font-size: 12px; }
.limit-row { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 7px; }
.limit-row b { color: var(--neon-2); font-weight: 600; }
.bar { height: 5px; border-radius: 9px; background: #1c130d; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--neon), var(--neon-2)); box-shadow: 0 0 10px rgba(255,122,24,.8); transition: width .3s; }
.bar > div.full { background: #ff3b3b; box-shadow: 0 0 10px rgba(255,59,59,.8); }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); display: none; place-items: center; z-index: 50; padding: 16px; }
.modal-bg.open { display: grid; }
.modal { width: 100%; max-width: 440px; background: var(--card); border-radius: 18px; padding: 20px; box-shadow: var(--box-glow); display: flex; flex-direction: column; gap: 12px; }
.modal h2 { color: var(--neon); text-shadow: var(--neon-glow); font-size: 17px; }
.modal label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
.modal input, .modal textarea { background: #0d0906; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; outline: none; }
.modal input:focus, .modal textarea:focus { border-color: var(--neon); }
.modal .hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
.row { display: flex; gap: 8px; justify-content: flex-end; }
.row .btn-new { width: auto; padding: 9px 18px; }

/* ---------- Mobile ---------- */
.scrim { display: none; }
@media (max-width: 760px) {
  .sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .25s; width: 280px; }
  .sidebar.open { transform: translateX(0); }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 15; }
  .menu-btn { display: block; }
  .bubble { max-width: 94%; }
  select.model { max-width: 130px; }
  .empty .big { font-size: 42px; }
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">N</div>
    <div><h1>Nevexona AI</h1><small>NEON CHAT</small></div>
  </div>
  <button class="btn-new" id="newChat">+ Новый чат</button>
  <div class="chats" id="chatList"></div>
  <div class="side-foot">
    <div class="limit">
      <div class="limit-row"><span>Сообщения сегодня</span><b id="limText">0/30</b></div>
      <div class="bar"><div id="limBar"></div></div>
    </div>
    <button class="ghost" id="openSettings">⚙ Настройки</button>
    <button class="ghost" id="exportBtn">⇩ Экспорт чатов</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>
    <span class="status-dot" id="dot"></span>
    <span class="title" id="statusText">Проверка Ollama…</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="speakBtn" title="Озвучивать ответы">🔇</button>
    <select class="model" id="model" title="Модель"></select>
  </header>

  <div class="messages" id="messages"><div class="wrap" id="wrap"></div></div>

  <div class="composer">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Напишите сообщение…  (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button type="button" class="mic" id="micBtn" title="Голосовой ввод">🎤</button>
      <button type="submit" class="send" id="sendBtn" title="Отправить">➤</button>
    </form>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>Настройки</h2>
    <label>Адрес Ollama
      <input id="setUrl" placeholder="http://localhost:11434">
    </label>
    <label>Системный промпт
      <textarea id="setSystem" rows="3" placeholder="Ты Nevexona AI, дружелюбный помощник. Отвечай на языке пользователя."></textarea>
    </label>
    <label>Язык голоса
      <input id="setLang" placeholder="ru-RU">
    </label>
    <label>Лимит сообщений в день (0 — без лимита)
      <input id="setLimit" type="number" min="0" placeholder="30">
    </label>
    <p class="hint">Всё работает без платных API: чат общается с Ollama на вашем компьютере. Чтобы страница с GitHub Pages могла подключиться, запустите Ollama с разрешением для сайта (см. README).</p>
    <div class="row">
      <button class="ghost" id="setCancel" style="width:auto;padding:9px 16px">Отмена</button>
      <button class="btn-new" id="setSave">Сохранить</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var LS = { chats: 'nvx_neon_chats', cur: 'nvx_neon_cur', cfg: 'nvx_neon_cfg', model: 'nvx_neon_model' };
  var DEFAULT_SYSTEM = 'Ты Nevexona AI, дружелюбный и точный помощник. Отвечай на языке пользователя.';
  var cfg = load(LS.cfg, { url: 'http://localhost:11434', system: DEFAULT_SYSTEM });
  var chats = load(LS.chats, []);
  var curId = localStorage.getItem(LS.cur);
  var busy = false, abortCtl = null;

  var $ = function (id) { return document.getElementById(id); };
  var elWrap = $('wrap'), elMsgs = $('messages'), elInput = $('input'), elSend = $('sendBtn');

  function load(key, fallback) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function save() {
    try { localStorage.setItem(LS.chats, JSON.stringify(chats)); localStorage.setItem(LS.cur, curId || ''); } catch (e) {}
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function baseUrl() { return (cfg.url || 'http://localhost:11434').replace(/\/+$/, ''); }
  function current() { return chats.find(function (c) { return c.id === curId; }); }

  /* ---------- tiny markdown: code blocks, inline code, bold ---------- */
  function render(text) {
    var parts = String(text).split(/```/);
    return parts.map(function (p, i) {
      if (i % 2 === 1) {
        var nl = p.indexOf('\n');
        var body = nl >= 0 && /^[\w+#.-]*$/.test(p.slice(0, nl).trim()) ? p.slice(nl + 1) : p;
        return '<pre><code>' + esc(body.replace(/\n$/, '')) + '</code></pre>';
      }
      return esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    }).join('');
  }

  /* ---------- chats ---------- */
  function newChat() {
    var c = { id: String(Date.now()), title: 'Новый чат', messages: [] };
    chats.unshift(c); curId = c.id; save(); renderAll(); closeSide();
    elInput.focus();
  }
  function deleteChat(id) {
    chats = chats.filter(function (c) { return c.id !== id; });
    if (curId === id) curId = chats[0] ? chats[0].id : null;
    save(); renderAll();
  }
  function renderList() {
    var el = $('chatList'); el.innerHTML = '';
    chats.forEach(function (c) {
      var b = document.createElement('div');
      b.className = 'chat-item' + (c.id === curId ? ' active' : '');
      b.innerHTML = '<span class="t">' + esc(c.title) + '</span><button class="del" title="Удалить">×</button>';
      b.onclick = function (e) {
        if (e.target.classList.contains('del')) { deleteChat(c.id); return; }
        if (busy) return;
        curId = c.id; save(); renderAll(); closeSide();
      };
      el.appendChild(b);
    });
  }
  function bubble(role, html, extra) {
    var m = document.createElement('div');
    m.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    m.innerHTML = (role === 'user' ? '' : '<div class="avatar">N</div>') + '<div class="bubble ' + (extra || '') + '">' + html + '</div>';
    elWrap.appendChild(m);
    elMsgs.scrollTop = elMsgs.scrollHeight;
    return m.querySelector('.bubble');
  }
  function renderMessages() {
    elWrap.innerHTML = '';
    var c = current();
    if (!c || !c.messages.length) {
      elWrap.innerHTML = '<div class="empty"><div class="big">NEVEXONA</div><p>Ваш приватный ИИ-чат на оранжевом неоне. Модель работает на вашем компьютере через Ollama, без платных API.</p><div class="chips"></div></div>';
      var chips = elWrap.querySelector('.chips');
      ['Объясни простыми словами, что такое нейросеть', 'Напиши функцию на Python для сортировки', 'Придумай название для кофейни'].forEach(function (t) {
        var b = document.createElement('button'); b.className = 'chip'; b.textContent = t;
        b.onclick = function () { elInput.value = t; send(); };
        chips.appendChild(b);
      });
      return;
    }
    c.messages.forEach(function (m) { bubble(m.role === 'user' ? 'user' : 'ai', render(m.content)); });
  }
  function renderAll() { renderList(); renderMessages(); }

  /* ---------- Ollama ---------- */
  function setStatus(on, text) {
    $('dot').className = 'status-dot' + (on ? ' on' : '');
    $('statusText').textContent = text;
  }
  function loadModels() {
    setStatus(false, 'Проверка Ollama…');
    return fetch(baseUrl() + '/api/tags').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      var list = (d.models || []).map(function (m) { return m.name; });
      var sel = $('model'); sel.innerHTML = '';
      if (!list.length) {
        sel.innerHTML = '<option value="">нет моделей</option>';
        setStatus(true, 'Ollama запущен, но моделей нет. Выполните: ollama pull qwen2.5');
        return;
      }
      list.forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
      var saved = localStorage.getItem(LS.model);
      if (saved && list.indexOf(saved) >= 0) sel.value = saved;
      setStatus(true, 'Ollama подключён · ' + list.length + ' мод.');
    }).catch(function () {
      $('model').innerHTML = '<option value="">—</option>';
      setStatus(false, 'Ollama не найден. Запустите его и проверьте адрес в настройках');
    });
  }

  function setBusy(b) {
    busy = b;
    elSend.textContent = b ? '■' : '➤';
    elSend.classList.toggle('stop', b);
    elSend.title = b ? 'Остановить' : 'Отправить';
  }

  function send() {
    if (busy) { if (abortCtl) abortCtl.abort(); return; }
    var text = elInput.value.trim();
    var model = $('model').value;
    if (!text) return;
    stopSpeak();
    if (tryCommand(text)) { elInput.value = ''; autosize(); return; }
    if (!model) { alert('Не выбрана модель. Запустите Ollama и скачайте модель, например: ollama pull qwen2.5'); return; }
    if (limitReached()) { alert('Дневной лимит исчерпан (' + getLimit() + ' сообщений). Он сбросится завтра, либо измените его в настройках.'); return; }

    var c = current();
    if (!c) { newChat(); c = current(); }
    if (!c.messages.length) c.title = text.slice(0, 40);
    c.messages.push({ role: 'user', content: text });
    elInput.value = ''; autosize(); save(); renderList();
    if (c.messages.length === 1) elWrap.innerHTML = '';
    bubble('user', esc(text));

    var out = bubble('ai', '', 'cursor');
    var acc = '';
    var payload = [{ role: 'system', content: cfg.system || DEFAULT_SYSTEM }].concat(c.messages.map(function (m) { return { role: m.role, content: m.content }; }));
    abortCtl = new AbortController();
    setBusy(true);

    fetch(baseUrl() + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: model, messages: payload, stream: true }),
      signal: abortCtl.signal
    }).then(function (res) {
      if (!res.ok) throw new Error('Ollama ответил ' + res.status);
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += dec.decode(r.value, { stream: true });
          var lines = buf.split('\n'); buf = lines.pop();
          lines.forEach(function (ln) {
            if (!ln.trim()) return;
            try {
              var j = JSON.parse(ln);
              if (j.message && j.message.content) { acc += j.message.content; out.innerHTML = render(acc); elMsgs.scrollTop = elMsgs.scrollHeight; }
            } catch (e) {}
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      out.innerHTML = (acc ? render(acc) + '<br><br>' : '') + '<span class="err">Не удалось связаться с Ollama. Проверьте, что он запущен, и адрес в настройках.</span>';
    }).then(function () {
      out.classList.remove('cursor');
      if (acc) { c.messages.push({ role: 'assistant', content: acc }); save(); speak(acc); addUse(); }
      else if (!out.querySelector('.err')) { out.innerHTML = '<span class="err">Пустой ответ.</span>'; }
      setBusy(false); abortCtl = null;
    });
  }

  /* ---------- Daily message limit (stored in this browser only) ---------- */
  function getLimit() { return typeof cfg.limit === 'number' && cfg.limit >= 0 ? cfg.limit : 30; }
  function dayKey() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function getUse() {
    var u = load('nvx_neon_use', null);
    if (!u || u.date !== dayKey()) u = { date: dayKey(), n: 0 };
    return u;
  }
  function limitReached() { var l = getLimit(); return l > 0 && getUse().n >= l; }
  function addUse() {
    var u = getUse(); u.n++;
    try { localStorage.setItem('nvx_neon_use', JSON.stringify(u)); } catch (e) {}
    paintLimit();
  }
  function paintLimit() {
    var l = getLimit(), n = getUse().n, bar = $('limBar');
    $('limText').textContent = l > 0 ? n + '/' + l : n + ' · без лимита';
    bar.style.width = l > 0 ? Math.min(100, n / l * 100) + '%' : '100%';
    bar.classList.toggle('full', l > 0 && n >= l);
  }

  /* ---------- Voice: speech to text and text to speech ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, heard = false;
  var speakOn = localStorage.getItem('nvx_neon_speak') === '1';

  function paintSpeak() { $('speakBtn').textContent = speakOn ? '🔊' : '🔇'; $('speakBtn').classList.toggle('on', speakOn); }
  function stopSpeak() { if (window.speechSynthesis) window.speechSynthesis.cancel(); }
  function speak(text, force) {
    if ((!speakOn && !force) || !window.speechSynthesis) return;
    stopSpeak();
    var clean = String(text).replace(/```[\s\S]*?```/g, ' фрагмент кода пропущен ').replace(/[`*#_>]/g, '');
    var u = new SpeechSynthesisUtterance(clean.slice(0, 1500));
    u.lang = cfg.lang || 'ru-RU';
    window.speechSynthesis.speak(u);
  }
  function toggleMic() {
    if (!SR) { alert('Этот браузер не поддерживает распознавание речи. Откройте чат в Chrome или Edge.'); return; }
    if (listening) { rec.stop(); return; }
    stopSpeak();
    heard = false;
    rec = new SR();
    rec.lang = cfg.lang || 'ru-RU';
    rec.interimResults = true;
    rec.continuous = false;
    rec.onstart = function () { listening = true; $('micBtn').classList.add('on'); };
    rec.onresult = function (e) {
      var t = '';
      for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      heard = true; elInput.value = t; autosize();
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') alert('Разрешите доступ к микрофону в настройках браузера для этого сайта.');
    };
    rec.onend = function () {
      listening = false; $('micBtn').classList.remove('on');
      if (heard && elInput.value.trim() && !busy) send();
    };
    try { rec.start(); } catch (e) {}
  }

  /* ---------- Voice and text commands (work inside the browser) ---------- */
  var SITES = {
    'ютуб': 'https://www.youtube.com', 'youtube': 'https://www.youtube.com',
    'гугл': 'https://www.google.com', 'google': 'https://www.google.com',
    'вк': 'https://vk.com', 'вконтакте': 'https://vk.com',
    'телеграм': 'https://web.telegram.org', 'telegram': 'https://web.telegram.org',
    'почту': 'https://mail.google.com', 'почта': 'https://mail.google.com', 'gmail': 'https://mail.google.com',
    'карты': 'https://maps.google.com', 'maps': 'https://maps.google.com',
    'гитхаб': 'https://github.com', 'github': 'https://github.com',
    'википедию': 'https://ru.wikipedia.org', 'википедия': 'https://ru.wikipedia.org', 'wikipedia': 'https://wikipedia.org'
  };
  function beep() {
    try {
      var A = window.AudioContext || window.webkitAudioContext, ctx = new A(), o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination); o.start();
      setTimeout(function () { o.stop(); ctx.close(); }, 700);
    } catch (e) {}
  }
  function lastAnswer() {
    var c = current(); if (!c) return '';
    for (var i = c.messages.length - 1; i >= 0; i--) if (c.messages[i].role === 'assistant') return c.messages[i].content;
    return '';
  }
  function tryCommand(raw) {
    var t = raw.toLowerCase().replace(/[.!?,\s]+$/, '').trim(), m;
    function done(html, plain) {
      if (elWrap.querySelector('.empty')) elWrap.innerHTML = '';
      bubble('user', esc(raw));
      bubble('ai', html);
      speak(plain || html.replace(/<[^>]+>/g, ''));
      return true;
    }
    function link(url) { return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>'; }

    if ((m = t.match(/^(?:открой|открыть|запусти|open)\s+(?:сайт\s+)?(.+)$/))) {
      var key = m[1].trim(), url = SITES[key] || (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(key) ? 'https://' + key : null);
      if (url) { window.open(url, '_blank', 'noopener'); return done('Открываю ' + link(url) + '<br><small>Если вкладка не открылась, нажмите на ссылку.</small>', 'Открываю ' + key); }
      return false;
    }
    if ((m = t.match(/^(?:найди|поищи|погугли|search)\s+(.+)$/))) {
      var q = 'https://www.google.com/search?q=' + encodeURIComponent(m[1]);
      window.open(q, '_blank', 'noopener');
      return done('Ищу: ' + esc(m[1]) + '<br>' + link(q), 'Ищу ' + m[1]);
    }
    if ((m = t.match(/^(?:позвони|набери|call)\s+(?:на\s+)?(\+?[\d\s()-]{5,})$/))) {
      var num = m[1].replace(/[^\d+]/g, '');
      var tel = 'tel:' + num;
      window.location.href = tel;
      return done('Открываю набор номера ' + esc(num) + '. Нажмите «позвонить» в приложении.<br>' + link(tel), 'Набираю ' + num);
    }
    if ((m = t.match(/^(?:напиши смс|смс|sms)\s+(?:на\s+)?(\+?[\d\s()-]{5,}?)(?:\s+([^\d].*))?$/))) {
      var n2 = m[1].replace(/[^\d+]/g, '');
      var sms = 'sms:' + n2 + (m[2] ? '?body=' + encodeURIComponent(m[2]) : '');
      window.location.href = sms;
      return done('Открываю сообщение для ' + esc(n2) + '. Отправить нужно вручную.<br>' + link(sms), 'Готовлю сообщение');
    }
    if ((m = t.match(/(?:таймер|засеки|timer).*?(\d+)\s*(секунд|сек|минут|мин|час)/))) {
      var k = parseInt(m[1], 10), u = m[2], ms = k * (u.indexOf('сек') === 0 ? 1000 : u.indexOf('мин') === 0 ? 60000 : 3600000);
      if (ms > 0 && ms <= 86400000) {
        setTimeout(function () { beep(); speak('Таймер сработал', true); bubble('ai', '⏰ Таймер на ' + k + ' ' + esc(u) + ' сработал!'); }, ms);
        return done('Таймер запущен: ' + k + ' ' + esc(u) + '. Страницу не закрывайте.', 'Таймер запущен');
      }
    }
    if (/^(?:скопируй|copy)(?:\s+ответ)?$/.test(t)) {
      var ans = lastAnswer();
      if (!ans) return done('Пока нечего копировать.');
      if (navigator.clipboard) navigator.clipboard.writeText(ans).catch(function () {});
      return done('Последний ответ скопирован в буфер обмена.', 'Скопировано');
    }
    if (/^(?:новый чат|очисти чат)$/.test(t)) { if (!busy) newChat(); return true; }
    return false;
  }

  $('micBtn').onclick = toggleMic;
  $('speakBtn').onclick = function () {
    speakOn = !speakOn; if (!speakOn) stopSpeak();
    try { localStorage.setItem('nvx_neon_speak', speakOn ? '1' : '0'); } catch (e) {}
    paintSpeak();
  };
  paintSpeak();

  /* ---------- UI wiring ---------- */
  function autosize() { elInput.style.height = 'auto'; elInput.style.height = Math.min(elInput.scrollHeight, 160) + 'px'; }
  function closeSide() { $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); }

  $('form').addEventListener('submit', function (e) { e.preventDefault(); send(); });
  elInput.addEventListener('input', autosize);
  elInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  $('newChat').onclick = function () { if (!busy) newChat(); };
  $('menuBtn').onclick = function () { $('sidebar').classList.add('open'); $('scrim').classList.add('open'); };
  $('scrim').onclick = closeSide;
  $('model').onchange = function () { localStorage.setItem(LS.model, this.value); };

  $('openSettings').onclick = function () {
    $('setUrl').value = cfg.url; $('setSystem').value = cfg.system; $('setLang').value = cfg.lang || 'ru-RU'; $('setLimit').value = getLimit();
    $('modalBg').classList.add('open'); closeSide();
  };
  $('setCancel').onclick = function () { $('modalBg').classList.remove('open'); };
  $('modalBg').onclick = function (e) { if (e.target === this) this.classList.remove('open'); };
  $('setSave').onclick = function () {
    cfg.url = $('setUrl').value.trim() || 'http://localhost:11434';
    cfg.system = $('setSystem').value.trim() || DEFAULT_SYSTEM;
    cfg.lang = $('setLang').value.trim() || 'ru-RU';
    var lim = parseInt($('setLimit').value, 10);
    cfg.limit = (isNaN(lim) || lim < 0) ? 30 : lim;
    paintLimit();
    try { localStorage.setItem(LS.cfg, JSON.stringify(cfg)); } catch (e) {}
    $('modalBg').classList.remove('open');
    loadModels();
  };
  $('exportBtn').onclick = function () {
    var blob = new Blob([JSON.stringify(chats, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'nevexona-chats.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };

  if (curId && !current()) curId = chats[0] ? chats[0].id : null;
  if (!curId && chats[0]) curId = chats[0].id;
  renderAll();
  paintLimit();
  loadModels();
})();
</script>
</body>
</html>
